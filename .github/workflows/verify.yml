name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Adena wallet, Agent Bus & Gnosh Peer Relay / MCP tests
        run: node --test web/adena-whisper.test.mjs bridge/whisper-agent-bus.test.mjs bridge/gnosh-peer-relay.test.mjs

  gno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
      - name: Checkout signals and assurance dependency
        run: git clone --depth 1 https://github.com/PossumXI/immaculate-sdk-agent-builder.git /tmp/immaculate-sdk-agent-builder
      - name: Build gno from gnolang/gno master
        run: |
          git clone --depth 1 https://github.com/gnolang/gno.git /tmp/gno
          cd /tmp/gno
          CGO_ENABLED=0 GOWORK=off go build -o /tmp/gno/build/gno ./gnovm/cmd/gno
      - name: Run gno test
        env:
          GNO_SRC: /tmp/gno
          ASSURANCE_REPO: /tmp/immaculate-sdk-agent-builder
        run: bash scripts/run-gno-tests.sh
